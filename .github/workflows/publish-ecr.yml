name: Publish Watchtower Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-watchtower-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: watchtower

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate shell scripts
        run: bash -n setup.sh run_live.sh run_container.sh scripts/*.sh

      - name: Build container image
        run: docker build --tag watchtower:validation .

      - name: Run closed-market container test
        run: docker run --rm watchtower:validation mock-test

      - name: Require AWS role configuration
        env:
          ROLE_ARN: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "Repository variable AWS_PUBLISH_ROLE_ARN is not configured." >&2
            exit 1
          fi

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push immutable image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:12}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag watchtower:validation "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"
