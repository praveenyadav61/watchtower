name: Validate Watchtower Container

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate shell scripts
        run: bash -n setup.sh run_live.sh run_container.sh scripts/*.sh

      - name: Build container image
        run: docker build --tag watchtower:validation .

      - name: Run closed-market container test
        run: docker run --rm watchtower:validation mock-test
